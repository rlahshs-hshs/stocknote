<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', BlinkMacSystemFont, sans-serif;
    background: #f5f4f0;
    color: #1a1a1a;
    padding-bottom: 48px;
  }
  .hero {
    background: #1a1a2e;

  .hero-tag { font-size: 11px; color: #7f77dd; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; margin-bottom: 10px; }
  .hero-title { font-size: 26px; font-weight: 700; color: #fff; line-height: 1.3; margin-bottom: 8px; }
  .hero-sub { font-size: 14px; color: rgba(255,255,255,0.5); line-height: 1.6; }

  .section { padding: 24px 16px 0; }
  .section-label { font-size: 11px; color: #888; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 12px; font-weight: 500; }

  .month-group { margin-bottom: 24px; }
  .month-label { font-size: 13px; font-weight: 600; color: #888; margin-bottom: 10px; padding-left: 2px; }

  .entry-card {
    background: #fff;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 8px;
    border: 1px solid rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    color: inherit;
    transition: background 0.15s;
  }
  .entry-card:active { background: #f0f0f0; }
  .entry-left { display: flex; flex-direction: column; gap: 4px; }
  .entry-date { font-size: 16px; font-weight: 600; color: #1a1a1a; }
  .entry-themes { font-size: 12px; color: #888; line-height: 1.5; }
  .entry-picks { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
  .pick-chip {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: #eeedfe;
    color: #534ab7;
    font-weight: 500;
  }
  .entry-arrow { font-size: 18px; color: #ccc; flex-shrink: 0; margin-left: 12px; }

  .empty-state {
    background: #fff;
    border-radius: 14px;
    padding: 32px 16px;
    text-align: center;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .empty-icon { font-size: 28px; margin-bottom: 10px; }
  .empty-text { font-size: 14px; color: #aaa; line-height: 1.6; }

  .footer { margin: 24px 16px 0; font-size: 12px; color: #bbb; text-align: center; line-height: 1.7; }
